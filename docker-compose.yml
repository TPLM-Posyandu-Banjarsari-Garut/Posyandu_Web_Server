services:
    app-dev:
        restart: unless-stopped
        image: posyandu-server:dev
        build:
            context: .
            dockerfile: dockerfile
            target: development
        ports:
            - '${PORT:-3000}:3000'
        environment:
            - NODE_ENV=development
            - TZ=Asia/Jakarta
            - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
            - PORT
            - LOG_LEVEL
            - CORS_ORIGIN
            - TRUSTED_ORIGINS
            - DATA_ENCRYPTION_KEY
            - BETTER_AUTH_SECRET
            - BETTER_AUTH_URL
            - GOOGLE_CLIENT_ID
            - GOOGLE_CLIENT_SECRET
            - RESEND_API_KEY
            - SENDER_EMAIL
            - CONTACT_NAME
            - CONTACT_WHATSAPP
            - CONTACT_EMAIL
            - RATE_LIMIT_GLOBAL_WINDOW_MINUTES
            - RATE_LIMIT_GLOBAL_MAX
            - RATE_LIMIT_AUTH_WINDOW_MINUTES
            - RATE_LIMIT_AUTH_MAX
            - RATE_LIMIT_SIGNIN_WINDOW_MINUTES
            - RATE_LIMIT_SIGNIN_MAX
            - RATE_LIMIT_SIGNUP_WINDOW_MINUTES
            - RATE_LIMIT_SIGNUP_MAX
            - RATE_LIMIT_OTP_REQ_WINDOW_MINUTES
            - RATE_LIMIT_OTP_REQ_MAX
            - RATE_LIMIT_OTP_VERIFY_WINDOW_MINUTES
            - RATE_LIMIT_OTP_VERIFY_MAX
            - RATE_LIMIT_RESET_PWD_WINDOW_MINUTES
            - RATE_LIMIT_RESET_PWD_MAX
            - RATE_LIMIT_DELETE_ACC_WINDOW_MINUTES
            - RATE_LIMIT_DELETE_ACC_MAX
            - RATE_LIMIT_CHANGE_PWD_WINDOW_MINUTES
            - RATE_LIMIT_CHANGE_PWD_MAX
            - RATE_LIMIT_MEDIA_UPLOAD_WINDOW_MINUTES
            - RATE_LIMIT_MEDIA_UPLOAD_MAX
            - R2_ACCOUNT_ID
            - R2_ACCESS_KEY_ID
            - R2_SECRET_ACCESS_KEY
            - R2_BUCKET_NAME
            - R2_PUBLIC_URL
            - MEDIA_UPLOAD_MAX_SIZE_MB
            - MEDIA_UPLOAD_MAX_RAW_SIZE_MB
            - MEDIA_UPLOAD_ALLOWED_EXTENSIONS
            - UPSTASH_REDIS_REST_URL
            - UPSTASH_REDIS_REST_TOKEN
            - UPSTASH_REDIS_URL
            - TURNSTILE_SECRET_KEY
            - CSRF_SECRET
            - CRON_SECRET
            - SESSION_EXPIRES_IN
            - SESSION_UPDATE_AGE
            - SESSION_COOKIE_CACHE_ENABLED
            - SESSION_COOKIE_CACHE_MAX_AGE
            - VAPID_PUBLIC_KEY
            - VAPID_PRIVATE_KEY
            - VAPID_SUBJECT
        volumes:
            - ./src:/app/src
            - bun_cache:/root/.bun
        networks:
            - application
        depends_on:
            postgres:
                condition: service_healthy
        command: ['bun', 'run', 'dev']

