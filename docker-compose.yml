    #                 'bun --eval "fetch(''http://localhost:${PORT:-3000}/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
    #             ]
    #         interval: 30s
    #         timeout: 5s
    #         start_period: 15s
    #         retries: 3

    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        volumes:
            - postgres_data:/var/lib/postgresql
        ports:
            - '127.0.0.1:${DB_PORT:-5432}:5432'
        environment:
            - POSTGRES_USER=${DATABASE_USER}
            - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
            - POSTGRES_DB=${DATABASE_NAME}
        networks:
            - application
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
                ]
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    application:
        driver: bridge

volumes:
    postgres_data:
    bun_cache:
